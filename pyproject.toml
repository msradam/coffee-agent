[project]
name = "coffee-agent"
version = "0.1.0"
description = "A toy coffee-ordering agent: a Burr state machine served as an MCP server with Theodosia."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "theodosia>=0.1.0,<0.2",
]

[project.scripts]
coffee-agent = "coffee_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coffee_agent"]
